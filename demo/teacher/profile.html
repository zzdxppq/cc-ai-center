<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的 - 教师端</title>
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body class="mobile-preview">
  <div class="mobile-container">
    <!-- Page Content (no navbar for profile) -->
    <div class="mobile-page" style="padding-top: 0;">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-avatar">👩‍🏫</div>
        <h2 class="profile-name">李老师</h2>
        <p class="profile-role">一年级1班 · 班主任</p>
      </div>

      <!-- Stats -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--color-border-light); margin: var(--spacing-md);">
        <div style="background: white; padding: var(--spacing-md); text-align: center;">
          <div style="font-size: 24px; font-weight: 600; color: var(--color-primary);">22</div>
          <div class="text-small text-secondary">我的学生</div>
        </div>
        <div style="background: white; padding: var(--spacing-md); text-align: center;">
          <div style="font-size: 24px; font-weight: 600; color: var(--color-success);">156</div>
          <div class="text-small text-secondary">本月批改</div>
        </div>
        <div style="background: white; padding: var(--spacing-md); text-align: center;">
          <div style="font-size: 24px; font-weight: 600; color: var(--color-secondary);">98%</div>
          <div class="text-small text-secondary">出勤率</div>
        </div>
      </div>

      <!-- Menu -->
      <div class="profile-menu">
        <div class="profile-menu-item">
          <div class="profile-menu-left">
            <div class="profile-menu-icon blue">📚</div>
            <span>我的班级</span>
          </div>
          <span class="profile-menu-arrow">›</span>
        </div>
        <div class="profile-menu-item">
          <div class="profile-menu-left">
            <div class="profile-menu-icon green">📊</div>
            <span>工作统计</span>
          </div>
          <span class="profile-menu-arrow">›</span>
        </div>
        <div class="profile-menu-item">
          <div class="profile-menu-left">
            <div class="profile-menu-icon orange">📝</div>
            <span>评语模板</span>
          </div>
          <span class="profile-menu-arrow">›</span>
        </div>
      </div>

      <div class="profile-menu">
        <div class="profile-menu-item">
          <div class="profile-menu-left">
            <div class="profile-menu-icon gray">⚙️</div>
            <span>设置</span>
          </div>
          <span class="profile-menu-arrow">›</span>
        </div>
        <div class="profile-menu-item">
          <div class="profile-menu-left">
            <div class="profile-menu-icon gray">❓</div>
            <span>帮助与反馈</span>
          </div>
          <span class="profile-menu-arrow">›</span>
        </div>
        <div class="profile-menu-item">
          <div class="profile-menu-left">
            <div class="profile-menu-icon gray">ℹ️</div>
            <span>关于</span>
          </div>
          <span class="profile-menu-arrow">›</span>
        </div>
      </div>

      <div style="padding: var(--spacing-lg);">
        <button class="btn btn-block btn-secondary" onclick="logout()">退出登录</button>
      </div>
    </div>

    <!-- Tab Bar -->
    <nav class="mobile-tabbar">
      <a href="index.html" class="tabbar-item">
        <span class="tabbar-icon">🏠</span>
        <span class="tabbar-label">工作台</span>
      </a>
      <a href="attendance.html" class="tabbar-item">
        <span class="tabbar-icon">✅</span>
        <span class="tabbar-label">签到</span>
      </a>
      <a href="homework.html" class="tabbar-item">
        <span class="tabbar-icon">📝</span>
        <span class="tabbar-label">作业</span>
      </a>
      <a href="growth.html" class="tabbar-item">
        <span class="tabbar-icon">📊</span>
        <span class="tabbar-label">成长</span>
      </a>
      <a href="profile.html" class="tabbar-item active">
        <span class="tabbar-icon">👤</span>
        <span class="tabbar-label">我的</span>
      </a>
    </nav>
  </div>

  <script>
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        window.location.href = '../index.html';
      }
    }
  </script>
</body>
</html>
